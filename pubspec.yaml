name: tts_flow_workspace
description: Melos-managed mono repo workspace for tts_flow_dart packages.
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - apps/tts_flow_dart_example
  - apps/tts_flow_flutter_example
  - packages/tts_flow_dart
  - packages/tts_flow_mimo
  - packages/tts_flow_gemini
  - packages/tts_flow_flutter

dev_dependencies:
  melos: ^7.0.0

melos:
  scripts:
    analyze:
      run: dart run melos exec -- dart analyze .
      description: Analyze all packages.

    format:
      run: dart run melos exec -- dart format .
      description: Format all packages.

    test:
      run: dart run melos run test:dart && dart run melos run test:flutter
      description: Run all tests.

    test:dart:
      run: dart run melos exec --dir-exists=test --no-flutter -- dart test

    test:flutter:
      run: dart run melos exec --dir-exists=test --flutter -- flutter test

    test:integration:macos:
      run: cd apps/tts_flow_flutter_example && flutter test integration_test/just_audio_jitter_test.dart -d macos && flutter test integration_test/playback_regression_test.dart -d macos
      description: Run the macOS JustAudio jitter and playback-control regressions.

    test:integration:windows:
      run: cd apps/tts_flow_flutter_example && flutter test integration_test/just_audio_jitter_test.dart -d windows && flutter test integration_test/playback_regression_test.dart -d windows
      description: Run the Windows JustAudio jitter and playback-control regressions.

    check:macos:
      run: >-
        dart run melos exec -- dart analyze . &&
        dart run melos exec --dir-exists=test --no-flutter -- dart test &&
        dart run melos exec --dir-exists=test --flutter -- flutter test &&
        cd apps/tts_flow_flutter_example &&
        flutter test integration_test/just_audio_jitter_test.dart -d macos && flutter test integration_test/playback_regression_test.dart -d macos
      description: Run all checks plus the macOS JustAudio integration regression.

    check:
      run: dart run melos run analyze && dart run melos run test
      description: Analyze and test all packages.
