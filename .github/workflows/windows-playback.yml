name: Windows playback regression

on:
  workflow_dispatch:
  schedule:
    # Thursday 03:30 UTC; native Windows playback is outside the Linux CI job.
    - cron: '30 3 * * 4'

permissions:
  contents: read

jobs:
  just-audio-jitter:
    name: JustAudio playback integration suites
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: dart run melos run test:integration:windows
