name: Provider live contracts

on:
  workflow_dispatch:
  schedule:
    # Wednesday 04:00 UTC. Each job is skipped unless its required secret exists.
    - cron: '0 4 * * 3'

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      mimo: ${{ steps.availability.outputs.mimo }}
    steps:
      - id: availability
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: |
          if [ -n "$MIMO_API_KEY" ]; then echo 'mimo=true' >> "$GITHUB_OUTPUT"; else echo 'mimo=false' >> "$GITHUB_OUTPUT"; fi

  mimo:
    needs: configuration
    if: ${{ needs.configuration.outputs.mimo == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: dart run tool/live_contract_check.dart
        working-directory: packages/tts_flow_mimo
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
