name: Release validation

on:
  workflow_dispatch:
  push:
    tags: ['tts_flow_*-v*']

permissions:
  contents: read

jobs:
  publish-dry-run:
    if: github.event_name == 'workflow_dispatch'
    name: Validate ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/tts_flow_dart
          - packages/tts_flow_flutter
          - packages/tts_flow_mimo
          - packages/tts_flow_gemini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart pub publish --dry-run
        working-directory: ${{ matrix.package }}

  tagged-package:
    if: github.event_name == 'push'
    name: Validate tagged package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: 3.47.7
          cache: true
      - name: Match tag, pubspec, and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            tts_flow_dart-v*) package=packages/tts_flow_dart ;;
            tts_flow_flutter-v*) package=packages/tts_flow_flutter ;;
            tts_flow_mimo-v*) package=packages/tts_flow_mimo ;;
            tts_flow_gemini-v*) package=packages/tts_flow_gemini ;;
            *) echo "Unsupported release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          version="${RELEASE_TAG#$(basename "$package")-v}"
          pubspec_version="$(awk '/^version:/{print $2; exit}' "$package/pubspec.yaml")"
          test "$version" = "$pubspec_version"
          grep -Eq "^##[[:space:]]+\[?$version\]?([[:space:]]|$)" "$package/CHANGELOG.md"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: dart pub publish --dry-run
        working-directory: ${{ env.PACKAGE }}
