name: Release validation

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish-dry-run:
    name: Validate ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/tts_flow_dart
          - packages/tts_flow_flutter
          - packages/tts_flow_openai
          - packages/tts_flow_azure
          - packages/tts_flow_mimo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          cache: true
      - run: dart pub get
      - run: dart pub publish --dry-run
        working-directory: ${{ matrix.package }}
