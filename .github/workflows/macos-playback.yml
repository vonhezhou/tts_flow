name: macOS playback regression

on:
  # 原生解码和播放时钟依赖 runner 环境，按需手动诊断。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  just-audio-jitter:
    name: JustAudio playback integration suites
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test/just_audio_jitter_test.dart -d macos
        working-directory: apps/tts_flow_flutter_example
      - run: flutter test integration_test/playback_regression_test.dart -d macos
        if: ${{ !cancelled() }}
        working-directory: apps/tts_flow_flutter_example
