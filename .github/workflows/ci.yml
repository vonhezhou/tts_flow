name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          cache: true
      - run: dart pub get
      - run: dart run melos run check

  coverage:
    name: Build coverage reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          cache: true
      - run: dart pub get
      - run: dart test --coverage=coverage
        working-directory: packages/tts_flow_dart
      - run: >-
          dart run coverage:format_coverage
          --lcov
          --in=coverage
          --out=coverage/lcov.info
          --packages=../../.dart_tool/package_config.json
          --report-on=lib
        working-directory: packages/tts_flow_dart
      - run: flutter test --coverage
        working-directory: packages/tts_flow_flutter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            packages/tts_flow_dart/coverage/lcov.info
            packages/tts_flow_flutter/coverage/lcov.info
          if-no-files-found: warn
