name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart run melos run check
      - run: python3 -m unittest discover -s tool -p 'test_*.py'

  coverage:
    name: Build coverage reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart test --coverage=coverage
        working-directory: packages/tts_flow_dart
      - run: >-
          dart run coverage:format_coverage
          --lcov
          --in=coverage
          --out=coverage/lcov.info
          --packages=../../.dart_tool/package_config.json
          --report-on=lib
        working-directory: packages/tts_flow_dart
      - name: Enforce Dart-core coverage baseline
        run: |
          line_coverage="$(awk -F: '/^LF:/{lf += $2} /^LH:/{lh += $2} END { if (lf == 0) exit 1; printf "%.2f", 100 * lh / lf }' coverage/lcov.info)"
          echo "Dart-core line coverage: ${line_coverage}%"
          awk -v coverage="$line_coverage" 'BEGIN { exit coverage < 76.0 }'
        working-directory: packages/tts_flow_dart
      - run: flutter test --coverage
        working-directory: packages/tts_flow_flutter
      - name: Enforce Flutter coverage baseline
        run: |
          line_coverage="$(awk -F: '/^LF:/{lf += $2} /^LH:/{lh += $2} END { if (lf == 0) exit 1; printf "%.2f", 100 * lh / lf }' coverage/lcov.info)"
          echo "Flutter line coverage: ${line_coverage}%"
          awk -v coverage="$line_coverage" 'BEGIN { exit coverage < 76.0 }'
        working-directory: packages/tts_flow_flutter
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-reports
          path: |
            packages/tts_flow_dart/coverage/lcov.info
            packages/tts_flow_flutter/coverage/lcov.info
          if-no-files-found: warn
